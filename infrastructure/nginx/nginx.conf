
events {
    worker_connections 4096;
}

http {
    limit_req_status 429;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    # Limit excessive requests from one client IP.
    limit_req_zone $binary_remote_addr
        zone=checkout_limit:10m rate=10r/s;

    limit_req_zone $binary_remote_addr
        zone=status_limit:10m rate=20r/s;

    upstream checkout_backend {
        server 192.168.65.254:8080;
        keepalive 32;
    }

    upstream status_backend {
        server 192.168.65.254:8082;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for the gateway itself.
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx-gateway"}';
        }

        # Checkout requests.
        location = /api/checkout {
            limit_req zone=checkout_limit burst=20 nodelay;

            proxy_pass http://checkout_backend/checkout;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Order status requests.
        location ^~ /api/orders/ {
            limit_req zone=status_limit burst=40 nodelay;

            rewrite ^/api/orders/(.*)$ /orders/$1 break;
            proxy_pass http://status_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Return a clear response for unknown API paths.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"API endpoint not found"}';
        }
    }
}
